<div class="step-row" [class.checked]="checked()" (click)="toggle.emit()">
  <div class="checkbox">
    <span class="check-mark">{{ checked() ? '✔' : '' }}</span>
  </div>
  <div class="step-content">
    <span class="instruction">{{ step().instruction }}</span>
  </div>
  <span class="step-type type-{{ step().type }}">{{ step().type }}</span>
</div>
